<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#0a0a0a"/>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="communityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="skillGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#00f2fe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#43e97b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Futuristic grid background -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#667eea" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#667eea" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#667eea" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#667eea" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#667eea" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="#667eea" stroke-width="0.5"/>
  </g>
  
  <!-- Network nodes -->
  <g transform="translate(150, 150)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="url(#communityGradient)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="15" fill="#667eea" opacity="0.3"/>
    <circle cx="40" cy="0" r="15" fill="none" stroke="url(#skillGradient)" stroke-width="1.5"/>
    <circle cx="40" cy="0" r="8" fill="#4facfe" opacity="0.3"/>
    <circle cx="-40" cy="0" r="15" fill="none" stroke="url(#skillGradient)" stroke-width="1.5"/>
    <circle cx="-40" cy="0" r="8" fill="#4facfe" opacity="0.3"/>
    <circle cx="0" cy="40" r="15" fill="none" stroke="url(#skillGradient)" stroke-width="1.5"/>
    <circle cx="0" cy="40" r="8" fill="#4facfe" opacity="0.3"/>
    <circle cx="0" cy="-40" r="15" fill="none" stroke="url(#skillGradient)" stroke-width="1.5"/>
    <circle cx="0" cy="-40" r="8" fill="#4facfe" opacity="0.3"/>
    <line x1="0" y1="0" x2="40" y2="0" stroke="url(#textGradient)" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="-40" y2="0" stroke="url(#textGradient)" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="40" stroke="url(#textGradient)" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="-40" stroke="url(#textGradient)" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Individual skill nodes -->
  <g transform="translate(300, 130)">
    <circle cx="0" cy="0" r="8" fill="url(#communityGradient)" opacity="0.8"/>
    <circle cx="25" cy="10" r="6" fill="url(#skillGradient)" opacity="0.6"/>
    <circle cx="50" cy="0" r="8" fill="url(#communityGradient)" opacity="0.8"/>
    <circle cx="25" cy="-10" r="6" fill="url(#skillGradient)" opacity="0.6"/>
  </g>
  
  <g transform="translate(300, 170)">
    <circle cx="0" cy="0" r="6" fill="url(#skillGradient)" opacity="0.6"/>
    <circle cx="30" cy="5" r="8" fill="url(#communityGradient)" opacity="0.8"/>
    <circle cx="60" cy="0" r="6" fill="url(#skillGradient)" opacity="0.6"/>
  </g>
  
  <!-- Floating particles -->
  <g transform="translate(350, 120)">
    <circle cx="0" cy="0" r="2" fill="#667eea" opacity="0.6"/>
    <circle cx="20" cy="5" r="1.5" fill="#764ba2" opacity="0.8"/>
    <circle cx="40" cy="0" r="2" fill="#f093fb" opacity="0.6"/>
    <circle cx="60" cy="5" r="1.5" fill="#4facfe" opacity="0.8"/>
  </g>
  
  <g transform="translate(350, 180)">
    <circle cx="0" cy="0" r="1.5" fill="#764ba2" opacity="0.8"/>
    <circle cx="20" cy="3" r="2" fill="#4facfe" opacity="0.6"/>
    <circle cx="40" cy="0" r="1.5" fill="#667eea" opacity="0.8"/>
    <circle cx="60" cy="3" r="2" fill="#00f2fe" opacity="0.6"/>
  </g>
  
  <!-- Main title -->
  <text x="450" y="160" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#textGradient)" filter="url(#glow)">
    Hermes Community
  </text>
  
  <text x="450" y="210" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#textGradient)" filter="url(#glow)">
    Skills Repository
  </text>
  
  <!-- Subtitle -->
  <text x="450" y="260" font-family="Arial, sans-serif" font-size="20" fill="#667eea" opacity="0.8">
    Advanced Skills & Frameworks for the Hermes Agent Ecosystem
  </text>
  
  <!-- Decorative accent lines -->
  <rect x="50" y="300" width="300" height="1" fill="url(#communityGradient)" opacity="0.5"/>
  <rect x="50" y="310" width="280" height="1" fill="url(#communityGradient)" opacity="0.3"/>
  
  <!-- Status indicators -->
  <g transform="translate(950, 140)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#667eea" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="15" fill="#00ff00" opacity="0.3"/>
    <circle cx="0" cy="0" r="5" fill="#00ff00"/>
  </g>
  
  <g transform="translate(1050, 140)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#4facfe" stroke-width="1" opacity="0.5"/>
    <rect x="-8" y="-8" width="16" height="16" fill="#4facfe" opacity="0.3"/>
    <rect x="-3" y="-3" width="6" height="6" fill="#4facfe"/>
  </g>
  
  <!-- Tech pattern overlay -->
  <g opacity="0.2">
    <path d="M1000 80 L1100 80 L1100 100 L1080 100 L1080 120 L1100 120 L1100 140 L1000 140 Z" 
          fill="none" stroke="#667eea" stroke-width="0.5"/>
    <path d="M1000 200 L1100 200 L1100 220 L1080 220 L1080 240 L1100 240 L1100 260 L1000 260 Z" 
          fill="none" stroke="#4facfe" stroke-width="0.5"/>
  </g>
</svg>