<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#1a1a2e"/>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="communityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="skillGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#00f2fe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#43e97b;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Community network nodes -->
  <g transform="translate(100, 150)">
    <circle cx="0" cy="0" r="8" fill="url(#skillGradient)"/>
    <circle cx="60" cy="0" r="8" fill="url(#skillGradient)"/>
    <circle cx="30" cy="-52" r="8" fill="url(#skillGradient)"/>
    <circle cx="30" cy="52" r="8" fill="url(#skillGradient)"/>
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#textGradient)" stroke-width="2"/>
    <line x1="0" y1="0" x2="30" y2="-52" stroke="url(#textGradient)" stroke-width="2"/>
    <line x1="0" y1="0" x2="30" y2="52" stroke="url(#textGradient)" stroke-width="2"/>
    <line x1="60" y1="0" x2="30" y2="-52" stroke="url(#textGradient)" stroke-width="1"/>
    <line x1="60" y1="0" x2="30" y2="52" stroke="url(#textGradient)" stroke-width="1"/>
  </g>
  
  <!-- Skill icons -->
  <g transform="translate(250, 140)">
    <rect x="0" y="0" width="30" height="30" fill="url(#communityGradient)" rx="5"/>
    <rect x="5" y="5" width="20" height="20" fill="url(#textGradient)" opacity="0.3"/>
    <circle cx="10" cy="10" r="2" fill="#ffffff"/>
    <circle cx="20" cy="10" r="2" fill="#ffffff"/>
    <circle cx="15" cy="20" r="2" fill="#ffffff"/>
  </g>
  
  <g transform="translate(300, 160)">
    <rect x="0" y="0" width="30" height="30" fill="url(#communityGradient)" rx="5"/>
    <rect x="5" y="5" width="20" height="20" fill="url(#textGradient)" opacity="0.3"/>
    <rect x="8" y="8" width="14" height="2" fill="#ffffff"/>
    <rect x="8" y="12" width="14" height="2" fill="#ffffff"/>
    <rect x="8" y="16" width="14" height="2" fill="#ffffff"/>
  </g>
  
  <g transform="translate(350, 150)">
    <rect x="0" y="0" width="30" height="30" fill="url(#communityGradient)" rx="5"/>
    <rect x="5" y="5" width="20" height="20" fill="url(#textGradient)" opacity="0.3"/>
    <polygon points="15,8 18,12 15,16 12,12" fill="#ffffff"/>
  </g>
  
  <!-- Main title -->
  <text x="450" y="180" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#textGradient)">
    Hermes Community Skills Repository
  </text>
  
  <!-- Subtitle -->
  <text x="450" y="230" font-family="Arial, sans-serif" font-size="24" fill="#a5b4fc">
    Your Central Hub for Advanced Hermes Agent Skills & Frameworks
  </text>
  
  <!-- Decorative elements -->
  <rect x="50" y="280" width="1100" height="2" fill="#667eea" opacity="0.5"/>
  
  <!-- Repository indicators -->
  <g transform="translate(850, 150)">
    <circle cx="0" cy="0" r="30" fill="#10b981" opacity="0.2"/>
    <polygon points="0,-15 4,-4 15,-4 6,2 10,13 0,6 -10,13 -6,2 -15,-4 -4,-4" fill="#10b981"/>
  </g>
  
  <g transform="translate(1000, 150)">
    <circle cx="0" cy="0" r="30" fill="#f59e0b" opacity="0.2"/>
    <path d="M-15 -10 L-15 10 Q-15 20 0 20 Q15 20 15 10 L15 -10 Q15 -20 0 -20 Q-15 -20 -15 -10" fill="#f59e0b"/>
    <circle cx="-5" cy="0" r="3" fill="#ffffff"/>
    <circle cx="5" cy="0" r="3" fill="#ffffff"/>
    <path d="M-5 5 Q0 10 5 5" stroke="#ffffff" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Security shield -->
  <g transform="translate(1050, 200)">
    <circle cx="0" cy="0" r="8" fill="#ef4444"/>
    <path d="M-3 -1 L-1 2 L3 -2" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>